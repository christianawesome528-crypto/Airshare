<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirShare — White</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;color:#111827}
.grid-bg{position:fixed;inset:0;background-image:radial-gradient(#e5e7eb 1px,transparent 1px);background-size:24px 24px;opacity:.6;z-index:-1}
nav{max-width:1200px;margin:0 auto;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px;letter-spacing:-1px}
.nav-pill{display:flex;gap:8px}
.pill-btn{padding:8px 14px;border-radius:100px;border:1px solid #e5e7eb;background:#fff;font-size:13px;font-weight:500;cursor:pointer}
.pill-btn.black{background:#111827;color:#fff;border-color:#111827}
.hero{max-width:900px;margin:60px auto 40px;text-align:center;padding:0 24px}
.hero h1{font-size:clamp(40px,7vw,80px);font-weight:800;line-height:.9;letter-spacing:-3px}
.hero h1 span{color:#2563eb}
.hero p{color:#6b7280;font-size:18px;margin-top:20px;line-height:1.5;max-width:500px;margin-inline:auto}
.card-wrap{max-width:640px;margin:0 auto;padding:0 20px}
.card{background:#fff;border:1px solid #e5e7eb;box-shadow:0 20px 40px rgba(0,0,0,.06);border-radius:24px;padding:24px}
.drop{border:2px dashed #d1d5db;border-radius:18px;padding:48px 20px;text-align:center;cursor:pointer;background:#f9fafb;transition:.2s}
.drop:hover{border-color:#2563eb;background:#eff6ff}
.drop-icon{width:48px;height:48px;background:#111827;border-radius:12px;display:grid;place-items:center;color:#fff;margin:0 auto 14px}
.bar-wrap{height:6px;background:#f3f4f6;border-radius:100px;margin-top:20px;overflow:hidden;display:none}
.bar{height:100%;width:0%;background:#111827;border-radius:100px;transition:width.2s}
.file{background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:14px 16px;margin-top:16px;display:none;justify-content:space-between}
.link-box{margin-top:16px;background:#111827;border-radius:14px;padding:14px;display:none}
.link-row{display:flex;gap:10px;margin-top:8px}
.link-row input{flex:1;background:#1f2937;border:1px solid #374151;border-radius:10px;padding:12px;color:#93c5fd}
.copy{padding:12px 18px;border-radius:10px;background:#fff;color:#111827;border:none;font-weight:600;cursor:pointer}
.features{max-width:1100px;margin:80px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:0 24px}
.feat{background:#fff;border:1px solid #f3f4f6;border-radius:20px;padding:24px}
.feat h4{font-size:14px;margin-bottom:6px}
.feat p{font-size:13px;color:#6b7280;line-height:1.6}
footer{text-align:center;padding:50px;color:#9ca3af;font-size:12px;border-top:1px solid #f3f4f6;margin-top:80px}
</style>
</head>
<body>
<div class="grid-bg"></div>
<nav><div class="logo">AirShare.</div><div class="nav-pill"><button class="pill-btn">API</button><button class="pill-btn black">Dashboard →</button></div></nav>
<div class="hero"><h1>Share files<br><span>faster.</span></h1><p>Clean white minimal sharing. Drop file, get link. Built on Neon + Pxxl.</p></div>
<div class="card-wrap"><div class="card">
<label class="drop" id="drop"><input type="file" id="fileIn" hidden><div class="drop-icon">↑</div><div style="font-weight:600">Drop files to upload</div><div style="font-size:13px;color:#6b7280;margin-top:4px">2GB max • PDF, PNG, ZIP</div><div class="bar-wrap" id="barWrap"><div class="bar" id="bar"></div></div></label>
<div class="file" id="fileRow"><div><b id="fName"></b><br><span id="fSize" style="font-size:12px;color:#6b7280"></span></div><span id="fStatus" style="background:#111827;color:#fff;padding:6px 10px;border-radius:100px;font-size:11px">Uploading</span></div>
<div class="link-box" id="linkBox"><label style="color:#9ca3af;font-size:11px">YOUR LINK READY</label><div class="link-row"><input id="linkInput" readonly><button class="copy" id="copyBtn">Copy</button></div><div id="status" style="font-size:12px;color:#6b7280;margin-top:8px"></div></div>
</div></div>
<script>
const DATABASE_CONFIG = { URL: "", files_table: "files", links_table: "share_links" };
const drop=document.getElementById('drop'),fileIn=document.getElementById('fileIn'),barWrap=document.getElementById('barWrap'),bar=document.getElementById('bar'),fileRow=document.getElementById('fileRow'),linkBox=document.getElementById('linkBox'),linkInput=document.getElementById('linkInput'),statusEl=document.getElementById('status');
drop.onclick=()=>fileIn.click(); drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='#2563eb'}; drop.ondrop=e=>{e.preventDefault();fileIn.files=e.dataTransfer.files;upload()}; fileIn.onchange=upload;
async function upload(){
 const f=fileIn.files[0]; if(!f)return;
 document.getElementById('fName').innerText=f.name; document.getElementById('fSize').innerText=(f.size/1024/1024).toFixed(2)+' MB';
 fileRow.style.display='flex'; barWrap.style.display='block'; bar.style.width='20%'; statusEl.textContent='Uploading to Neon...';
 const fd=new FormData(); fd.append('file',f);
 fd.append('fileName',f.name); fd.append('fileSize',f.size);
 try{
  const res=await fetch('/.netlify/functions/upload',{method:'POST',headers:{'x-file-name':f.name,'x-file-size':f.size},body:fd});
  const data=await res.json(); bar.style.width='100%'; linkInput.value=location.origin+'/s/'+data.slug; linkBox.style.display='block'; statusEl.textContent='Saved to files & share_links ✓'; document.getElementById('fStatus').innerText='Done ✓';
 }catch(e){statusEl.textContent='Error: '+e.message}
}
document.getElementById('copyBtn').onclick=()=>{linkInput.select();document.execCommand('copy');document.getElementById('copyBtn').innerText='Copied!'};
</script>
</body>
</html>
