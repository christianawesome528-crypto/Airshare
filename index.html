<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AirShare White</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff;color:#111}
nav{padding:18px 20px;display:flex;justify-content:space-between;max-width:1100px;margin:auto;font-weight:800}
.hero{text-align:center;padding:40px 20px}
.hero h1{font-size:56px;font-weight:900;line-height:.9;letter-spacing:-2px}
.hero h1 span{color:#2563eb}
.wrap{max-width:600px;margin:auto;padding:0 16px}
.card{border:1px solid #e5e7eb;border-radius:24px;padding:20px;box-shadow:0 20px 40px rgba(0,0,0,.06)}
.drop{border:2px dashed #ccc;border-radius:18px;padding:40px;text-align:center;cursor:pointer;background:#f9fafb}
.drop:hover{border-color:#2563eb;background:#eff6ff}
#fileRow{display:none;margin-top:12px;background:#f9fafb;border:1px solid #eee;border-radius:12px;padding:12px}
#preview{display:none;margin-top:12px}
#preview img{width:100%;border-radius:12px;max-height:350px;object-fit:contain;border:1px solid #eee}
#linkBox{display:none;margin-top:12px;background:#111;border-radius:12px;padding:12px}
#linkBox input{width:70%;padding:10px;border-radius:8px;border:none;background:#222;color:#7fb4ff}
#linkBox button{padding:10px 14px;border-radius:8px;border:none;margin-left:6px;font-weight:700;cursor:pointer}
.barWrap{display:none;height:6px;background:#eee;border-radius:10px;margin-top:12px;overflow:hidden}
.bar{height:100%;width:0%;background:#111;transition:.2s}
</style>
</head>
<body>
<nav><div>AirShare.</div><div style="font-size:12px;border:1px solid #e5e7eb;padding:6px 10px;border-radius:999px">White Edition</div></nav>
<div class="hero"><h1>Share files<br><span>faster.</span></h1><p style="color:#888;margin-top:10px">Drop image, see preview + link instantly</p></div>
<div class="wrap">
<div class="card">
<div class="drop" id="drop">
<input type="file" id="fileIn" hidden accept="image/*,.pdf,.zip,.mp4,.png,.jpg,.jpeg">
<div style="font-size:28px">↑</div>
<b>Tap to upload image</b>
<div style="color:#888;font-size:13px;margin-top:4px">PNG, JPG, PDF works 100%</div>
<div class="barWrap" id="barWrap"><div class="bar" id="bar"></div></div>
</div>

<div id="fileRow"><b id="fName"></b> - <span id="fSize" style="color:#888;font-size:12px"></span></div>
<div id="preview"><img id="previewImg"></div>
<div id="linkBox">
<div style="color:#999;font-size:11px;letter-spacing:1px">YOUR LINK READY</div>
<div style="display:flex;margin-top:6px"><input id="linkInput" readonly><button id="copyBtn">Copy</button></div>
</div>
</div>
</div>

<script>
const drop=document.getElementById('drop');
const fileIn=document.getElementById('fileIn');
const barWrap=document.getElementById('barWrap');
const bar=document.getElementById('bar');
const fileRow=document.getElementById('fileRow');
const preview=document.getElementById('preview');
const previewImg=document.getElementById('previewImg');
const linkBox=document.getElementById('linkBox');
const linkInput=document.getElementById('linkInput');

drop.addEventListener('click', ()=> fileIn.click());
drop.addEventListener('dragover', e=>{e.preventDefault(); drop.style.borderColor='#2563eb';});
drop.addEventListener('dragleave', ()=> drop.style.borderColor='#ccc');
drop.addEventListener('drop', e=>{e.preventDefault(); fileIn.files=e.dataTransfer.files; showFile();});
fileIn.addEventListener('change', showFile);

function showFile(){
  const file=fileIn.files[0];
  if(!file) return;

  // Show file name
  document.getElementById('fName').innerText=file.name;
  document.getElementById('fSize').innerText=(file.size/1024).toFixed(1)+' KB';
  fileRow.style.display='block';

  // Show image preview if image
  if(file.type.startsWith('image/')){
    const url=URL.createObjectURL(file);
    previewImg.src=url;
    preview.style.display='block';
  }

  // Show progress bar
  barWrap.style.display='block';
  let w=0;
  const timer=setInterval(()=>{
    w+=20;
    bar.style.width=w+'%';
    if(w>=100){
      clearInterval(timer);
      // Show link
      const slug=Math.random().toString(36).substring(2,8);
      linkInput.value=window.location.origin + '/s/' + slug;
      // If opened as file://, give fake domain
      if(linkInput.value.includes('file://')){
        linkInput.value='https://airshare.netlify.app/s/'+slug;
      }
      linkBox.style.display='block';
    }
  },120);
}

document.getElementById('copyBtn').onclick=()=>{
  linkInput.select();
  document.execCommand('copy');
  document.getElementById('copyBtn').innerText='Copied!';
  setTimeout(()=>document.getElementById('copyBtn').innerText='Copy',1000);
};
</script>
</body>
</html>
